[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-paper-sim"
version = "0.2.1"
description = "Thin deterministic paper CLI over quant-execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@v0.4.1",
]

[project.optional-dependencies]
dev = [
    "exceptiongroup>=1; python_version < '3.11'",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff==0.16.5",
    "tomli>=1; python_version < '3.11'",
]

[tool.quant-workspace]
layer = "execution"
schemas = [
    { id = "quant-paper-execution-log", version = "1.0.0" },
    { id = "puresaber.execution.order", version = "1.1.0" },
    { id = "puresaber.execution.order-event", version = "1.1.0" },
    { id = "puresaber.execution.fill", version = "1.1.0" },
    { id = "puresaber.execution.fee", version = "1.1.0" },
    { id = "puresaber.execution.ledger-transaction", version = "1.1.0" },
    { id = "puresaber.execution.run-result", version = "1.1.0" },
]
lock-files = ["requirements.lock"]

[project.scripts]
quant-paper = "quant_paper_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_paper_sim = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["quant_paper_sim"]

[tool.coverage.report]
fail_under = 80
show_missing = true
