name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools

      - name: Pytest with branch coverage
        run: >-
          python -m pytest --cov=quant_paper_sim --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json -q

      - name: Enforce coverage gates
        run: |
          python -m coverage report --fail-under=80
          python tools/check_branch_coverage.py coverage.json --threshold 90 state execution engine
